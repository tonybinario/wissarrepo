<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Performance Benchmark - Volle Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>API Versuchsreihe</h1>

<div class="info-box">
    <h3>Systembeschreibung</h3>
    <p>Dieses Testbed führt exakt die definierten Abfragen deiner Arbeit aus. Beim REST-Massenabruf werden die Anfragen
        parallel geschossen, um den GraphQL-Vorteil fair zu vergleichen.</p>
</div>

<div class="config-section">
    <label for="testCase">Wähle den konkreten Testfall:</label>
    <select id="testCase">
        <option value="test1">Szenario 1: Gebäude mit ihren Haushalten</option>
        <option value="test2">Szenario 2: Haushalte mit ihrem jeweiligen User</option>
        <option value="scenario2">Szenario 3: Gezielte Einzelabfrage (User ID: 1)</option>
        <option value="scenario3">Szenario 4: Massenabruf aller flachen Entitäten</option>
    </select>
</div>
<div class="test-section">
    <h2>1. REST API Testbed</h2>
    <button id="btnRest">REST Abfrage starten</button>
    <div id="resRest" class="results"></div>
</div>

<div class="test-section">
    <h2>2. GraphQL Testbed</h2>
    <button id="btnGql">GraphQL Abfrage starten</button>
    <div id="resGql" class="results"></div>
</div>
<script>
    // JETZT STRUKTURELL UND BENAMUNGSSEITIG EXAKT SYNCHRON ZUM DROPDOWN!
    const GQL_QUERIES = {
        // Test 1: Gebäude -> Haushalte
        test1: {
            query: "query TestBuildingToHouseholds { buildings { id address city households { id room_number } } }"
        },

        // Test 2: Haushalte -> User (Hier knallte es vorhin, weil die Zuordnung falsch war!)
        test2: {
            query: "query TestHouseholdToUser { households { id room_number user { id email } } }"
        },

        // Szenario 2: Gezielte Einzelabfrage (User ID: 1)
        scenario2: {
            query: "query GetSingleUser { user(id: 1) { id email } }"
        },

        // Szenario 3: Massenabruf (Die 3 parallelen User-Requests)
        scenario3: {
            query: "query MassenabrufFlach { users { id email } households { id room_number } buildings { id address city } }"        }
    };

    function displayResult(elementId, isSuccess, duration, payloadSize, extraInfo = "") {
        const el = document.getElementById(elementId);
        el.style.display = "block";
        if (isSuccess) {
            el.className = "results success";
            el.innerHTML = `<strong>Status:</strong> 200 OK\n<strong>Dauer:</strong> ${duration.toFixed(2)} ms\n<strong>Payload:</strong> ${payloadSize} KB\n<span>${extraInfo}</span>`;
        } else {
            el.className = "results error";
            el.innerHTML = `<strong>Fehler:</strong> ${extraInfo}`;
        }
    }

    // --- REST LOGIK ---
    document.getElementById('btnRest').addEventListener('click', async () => {
        const btn = document.getElementById('btnRest');
        const resEl = document.getElementById('resRest');
        const activeCase = document.getElementById('testCase').value;

        btn.disabled = true;
        resEl.style.display = "block";
        resEl.innerText = "Lade REST-Daten...";

        const start = performance.now();
        try {
            let rawText = "";
            let info = "";

            if (activeCase === 'test1') {
                const res = await fetch('/api/buildings');
                rawText = await res.text();
                info = "Test Szenario 1: Gebäude inkl. Households geladen";
            }
            else if (activeCase === 'test2') {
                const res = await fetch('/api/households');
                rawText = await res.text();
                info = "Test Szenario  2: households inkl. User geladen";
            }
            else if (activeCase === '3') {
                const res = await fetch('/api/users/1');
                rawText = await res.text();
                info = "Test Szenario 3: Einzelner User mit ID 1 geladen";
            }
            else if (activeCase === 'scenario3') {
                const [r1, r2, r3] = await Promise.all([
                    fetch('/api/users'),
                    fetch('/api/households/flat'), // Liefert flache Haushalte (ohne verschachtelte User)
                    fetch('/api/buildings/flat')
                ]);
                const t1 = await r1.text();
                const t2 = await r2.text();
                const t3 = await r3.text();
                rawText = t1 + t2 + t3;
                info = "Test Szenario 4: 3 separate Requests (User 1, 2, 3) parallel gefeuert";
            }

            const end = performance.now();
            displayResult('resRest', true, end - start, (rawText.length / 1024).toFixed(2), info);

        } catch (err) {
            displayResult('resRest', false, 0, 0, err.message);
        } finally {
            btn.disabled = false;
        }
    });

    // --- GRAPHQL LOGIK ---
    document.getElementById('btnGql').addEventListener('click', async () => {
        const btn = document.getElementById('btnGql');
        const resEl = document.getElementById('resGql');
        const activeCase = document.getElementById('testCase').value;

        btn.disabled = true;
        resEl.style.display = "block";
        resEl.innerText = "Sende GraphQL-Query...";

        const start = performance.now();
        try {
            const response = await fetch('/graphql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(GQL_QUERIES[activeCase]) // Lädt exakt das Match aus dem Dropdown-Value!
            });

            if (!response.ok) throw new Error(`Status: ${response.status}`);

            const rawText = await response.text();
            const jsonResult = JSON.parse(rawText);
            const end = performance.now();

            if (jsonResult.errors) throw new Error(jsonResult.errors[0].message);

            displayResult('resGql', true, end - start, (rawText.length / 1024).toFixed(2), `Erfolgreich über /graphql ausgeführt.`);
        } catch (err) {
            displayResult('resGql', false, 0, 0, err.message);
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
